apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-hello
  template:
    metadata:
      labels:
        app: devops-hello
    spec:
      containers:
        - name: web
          image: YOUR_DOCKERHUB_USERNAME/devops-hello:1.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
