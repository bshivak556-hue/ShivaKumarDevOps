<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Event Registration</title></head>
<body>
  <h1>College Event Registration</h1>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    <label>Name <input name="name" required></label><br>
    <label>Email <input name="email" type="email" required></label><br>
    <label>Event
      <select name="event" required>
        <option value="">Choose an event</option>
        <option value="Hackathon">Hackathon</option>
        <option value="Technical Fest">Technical Fest</option>
        <option value="Cultural Fest">Cultural Fest</option>
      </select>
    </label><br>
    <button type="submit">Register</button>
  </form>
</body>
</html>
